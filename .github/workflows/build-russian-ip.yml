name: Build Russian IP

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-routing-configs]
  push:
    branches: [main]
    paths:
      - XRAY_JSON/RUSSIAN_IP.JSON
      - scripts/build-russian-ip.sh
      - scripts/render-russian-ip.py
      - scripts/render-xray-json.sh
      - scripts/check-russian-ip.py
      - scripts/sync-russian-ip.sh
      - scripts/tests/test_russian_ip_sync.py
      - .github/workflows/build-russian-ip.yml
  pull_request:
    paths:
      - XRAY_JSON/RUSSIAN_IP.JSON
      - scripts/build-russian-ip.sh
      - scripts/render-russian-ip.py
      - scripts/render-xray-json.sh
      - scripts/check-russian-ip.py
      - scripts/sync-russian-ip.sh
      - scripts/tests/test_russian_ip_sync.py
      - .github/workflows/build-russian-ip.yml

permissions:
  contents: read

concurrency:
  group: russian-ip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Test Russian IP synchronization
        run: python3 -m unittest discover -s scripts/tests -p 'test_russian_ip_sync.py' -v

      - name: Install Xray
        shell: bash
        env:
          XRAY_VERSION: v26.11.9
          XRAY_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "$XRAY_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"

      - name: Build and validate both templates
        run: bash scripts/build-russian-ip.sh dist/russian-ip "$RUNNER_TEMP/xray/xray"

      - uses: actions/upload-artifact@v4
        with:
          name: russian-ip
          path: dist/russian-ip/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: russian-ip
          path: dist/russian-ip

      - name: Verify published files
        working-directory: dist/russian-ip
        run: sha256sum --check SHA256SUMS

      - name: Publish Russian IP release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/russian-ip-notes.md"
          cat > "$notes" <<'EOF'
          Russian IP templates built from FreemanVPN GeoIP and Geosite releases.

          - RUSSIAN_IP.JSON: expanded Remnawave template; client DAT files are not required.
          - RUSSIAN_IP.compact.JSON: requires FreemanVPN DAT files supplied by the subscription/client.
          - build-info.json: source commit, geodata versions and DAT checksums.
          - SHA256SUMS: checksums of both templates and build metadata.

          Installation: https://github.com/losogudok/freemanvpn-routing/blob/main/docs/runbooks/russian-ip.md
          EOF
          if gh release view russian-ip --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload russian-ip dist/russian-ip/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit russian-ip --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create russian-ip dist/russian-ip/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Russian IP" --notes-file "$notes" --latest=false
          fi

  sync-remnawave:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: russian-ip
          path: dist/russian-ip

      - name: Verify deployment files
        working-directory: dist/russian-ip
        run: sha256sum --check SHA256SUMS

      - name: Update Russian IP template in Remnawave
        env:
          REMNAWAVE_API_BASE_URL: ${{ vars.REMNAWAVE_API_BASE_URL }}
          REMNAWAVE_TOKEN: ${{ secrets.REMNAWAVE_TOKEN }}
          REMNAWAVE_RU_IP_TEMPLATE_UUID: ${{ vars.REMNAWAVE_RU_IP_TEMPLATE_UUID }}
        run: bash scripts/sync-russian-ip.sh dist/russian-ip/RUSSIAN_IP.JSON
