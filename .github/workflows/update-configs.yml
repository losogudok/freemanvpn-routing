name: Update Routing Configs

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Run sync-remnawave even without routing changes'
        type: boolean
        default: false
  pull_request:
    paths:
      - XRAY_JSON/**
      - scripts/render-xray-json.sh
      - scripts/render-xray-least-load.sh
      - scripts/check-russian-ip.py
      - scripts/sync-remnawave-routing.sh
      - scripts/tests/test_remnawave_sync.py
      - .github/workflows/update-configs.yml
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  repository_dispatch:
    types: [update-routing-configs]

permissions:
  contents: write

concurrency:
  group: update-routing-configs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Test routing synchronization
        run: python3 -m unittest discover -s scripts/tests -p 'test_remnawave_sync.py' -v

      - name: Install Xray
        shell: bash
        env:
          XRAY_VERSION: v26.11.9
          XRAY_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "$XRAY_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"

      - name: Build and validate Xray JSON templates
        shell: bash
        run: |
          set -euo pipefail
          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' | sort -r | sed -n '1p'
          }
          FREEMAN_GEOIP_TAG="$(latest_tag losogudok/freemanvpn-geoip)"
          FREEMAN_GEOSITE_TAG="$(latest_tag losogudok/freemanvpn-geosite)"
          export FREEMAN_GEOIP_TAG FREEMAN_GEOSITE_TAG
          [[ "$FREEMAN_GEOIP_TAG" =~ ^[0-9]{12}$ && "$FREEMAN_GEOSITE_TAG" =~ ^[0-9]{12}$ ]]
          bundle=dist/xray-json
          ru_dir="$bundle/russian-ip"
          assets="$RUNNER_TEMP/freemanvpn-assets"
          xray="$RUNNER_TEMP/xray/xray"
          mkdir -p "$ru_dir" "$assets"
          geoip_url="https://raw.githubusercontent.com/losogudok/freemanvpn-geoip/${FREEMAN_GEOIP_TAG}/release/geoip.dat"
          geosite_url="https://raw.githubusercontent.com/losogudok/freemanvpn-geosite/${FREEMAN_GEOSITE_TAG}/release/geosite.dat"
          curl -fsSL --retry 3 --retry-delay 2 -o "$assets/geoip.dat" "$geoip_url"
          curl -fsSL --retry 3 --retry-delay 2 -o "$assets/geosite.dat" "$geosite_url"
          bash scripts/render-xray-json.sh XRAY_JSON/DEFAULT.JSON "$bundle/default.json"
          bash scripts/render-xray-least-load.sh --rendered "$bundle/default.json" "$bundle/leastload.json"
          bash scripts/render-xray-json.sh XRAY_JSON/RUSSIAN_IP.JSON "$ru_dir/RUSSIAN_IP.JSON"
          python3 scripts/check-russian-ip.py XRAY_JSON/RUSSIAN_IP.JSON --xray "$xray" --assets "$assets"
          python3 scripts/check-russian-ip.py "$ru_dir/RUSSIAN_IP.JSON" --xray "$xray"
          cp XRAY_JSON/RUSSIAN_IP.JSON "$ru_dir/RUSSIAN_IP.compact.JSON"
          jq -n --arg commit "$GITHUB_SHA" --arg xray "$("$xray" version | sed -n '1p')" \
            --arg geoip_tag "$FREEMAN_GEOIP_TAG" --arg geoip_url "$geoip_url" \
            --arg geoip_sha256 "$(sha256sum "$assets/geoip.dat" | awk '{print $1}')" \
            --arg geosite_tag "$FREEMAN_GEOSITE_TAG" --arg geosite_url "$geosite_url" \
            --arg geosite_sha256 "$(sha256sum "$assets/geosite.dat" | awk '{print $1}')" \
            '{sourceCommit: $commit, xrayVersion: $xray,
              geoip: {tag: $geoip_tag, url: $geoip_url, sha256: $geoip_sha256},
              geosite: {tag: $geosite_tag, url: $geosite_url, sha256: $geosite_sha256}}' \
            > "$ru_dir/build-info.json"
          (cd "$ru_dir" && sha256sum RUSSIAN_IP.JSON RUSSIAN_IP.compact.JSON build-info.json > SHA256SUMS)
          (cd "$bundle" && sha256sum default.json leastload.json russian-ip/* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: xray-json
          path: dist/xray-json/
          if-no-files-found: error
          retention-days: 30


  publish-xray:
    needs: build-xray
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xray-json
          path: dist/xray-json

      - name: Verify published files
        working-directory: dist/xray-json/russian-ip
        run: sha256sum --check SHA256SUMS

      - name: Publish Russian IP release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/russian-ip-notes.md"
          cat > "$notes" <<'EOF'
          Russian IP templates built from FreemanVPN GeoIP and Geosite releases.

          - RUSSIAN_IP.JSON: expanded Remnawave template; client DAT files are not required.
          - RUSSIAN_IP.compact.JSON: requires FreemanVPN DAT files supplied by the subscription/client.
          - build-info.json: source commit, geodata versions and DAT checksums.
          - SHA256SUMS: checksums of both templates and build metadata.

          Installation: https://github.com/losogudok/freemanvpn-routing/blob/main/docs/runbooks/russian-ip.md
          EOF
          if gh release view russian-ip --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload russian-ip dist/xray-json/russian-ip/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit russian-ip --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create russian-ip dist/xray-json/russian-ip/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Russian IP" --notes-file "$notes" --latest=false
          fi


  update:
    needs: build-xray
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      happ_default: ${{ steps.deeplinks.outputs.happ_default }}
      happ_whitelist: ${{ steps.deeplinks.outputs.happ_whitelist }}
      happ_json: ${{ steps.deeplinks.outputs.happ_json }}
      incy_default: ${{ steps.deeplinks.outputs.incy_default }}
      incy_whitelist: ${{ steps.deeplinks.outputs.incy_whitelist }}
      incy_json: ${{ steps.deeplinks.outputs.incy_json }}
      routing_changed: ${{ steps.routing_change.outputs.changed }}
      source_commit: ${{ steps.deeplinks.outputs.source_commit }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update HAPP configs
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="losogudok/freemanvpn-geoip"
          GEOSITE_REPO="losogudok/freemanvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          epoch_to_tag_utc() {
            local e="${1:-0}"
            if [[ "$e" =~ ^[0-9]+$ ]] && (( e > 0 )); then
              date -u -d "@$e" +%Y%m%d%H%M
            else
              printf '000000000000'
            fi
          }

          current_epoch="$(jq -r '.LastUpdated // empty' HAPP/DEFAULT.JSON 2>/dev/null || true)"
          [[ "$current_epoch" =~ ^[0-9]+$ ]] || current_epoch="0"
          current_tag="$(epoch_to_tag_utc "$current_epoch")"

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          max_tag="$(printf "%s\n%s\n" "$geoip_tag" "$geosite_tag" | sort -r | head -n 1)"

          if [[ "$current_tag" < "$max_tag" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}@${geoip_tag}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}@${geosite_tag}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/DEFAULT.JSON > "$tmp"
            mv "$tmp" HAPP/DEFAULT.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/WHITELIST.JSON > "$tmp"
            mv "$tmp" HAPP/WHITELIST.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/JSONSUB.JSON > "$tmp"
            mv "$tmp" HAPP/JSONSUB.JSON
          fi

          default_b64="$(jq -c . HAPP/DEFAULT.JSON | base64 -w 0)"
          whitelist_b64="$(jq -c . HAPP/WHITELIST.JSON | base64 -w 0)"
          jsonsub_b64="$(jq -c . HAPP/JSONSUB.JSON | base64 -w 0)"

          printf 'happ://routing/onadd/%s\n' "$default_b64" > HAPP/DEFAULT.DEEPLINK
          printf 'happ://routing/onadd/%s\n' "$whitelist_b64" > HAPP/WHITELIST.DEEPLINK
          printf 'happ://routing/onadd/%s\n' "$jsonsub_b64" > HAPP/JSONSUB.DEEPLINK
          
      - name: Update INCY configs
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="losogudok/freemanvpn-geoip"
          GEOSITE_REPO="losogudok/freemanvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          epoch_to_tag_utc() {
            local e="${1:-0}"
            if [[ "$e" =~ ^[0-9]+$ ]] && (( e > 0 )); then
              date -u -d "@$e" +%Y%m%d%H%M
            else
              printf '000000000000'
            fi
          }

          current_epoch="$(jq -r '.LastUpdated // empty' INCY/DEFAULT.JSON 2>/dev/null || true)"
          [[ "$current_epoch" =~ ^[0-9]+$ ]] || current_epoch="0"
          current_tag="$(epoch_to_tag_utc "$current_epoch")"

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          max_tag="$(printf "%s\n%s\n" "$geoip_tag" "$geosite_tag" | sort -r | head -n 1)"

          if [[ "$current_tag" < "$max_tag" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/DEFAULT.JSON > "$tmp"
            mv "$tmp" INCY/DEFAULT.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/WHITELIST.JSON > "$tmp"
            mv "$tmp" INCY/WHITELIST.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/JSONSUB.JSON > "$tmp"
            mv "$tmp" INCY/JSONSUB.JSON
          fi

          default_b64="$(jq -c . INCY/DEFAULT.JSON | base64 -w 0)"
          whitelist_b64="$(jq -c . INCY/WHITELIST.JSON | base64 -w 0)"
          jsonsub_b64="$(jq -c . INCY/JSONSUB.JSON | base64 -w 0)"

          printf 'incy://routing/onadd/%s\n' "$default_b64" > INCY/DEFAULT.DEEPLINK
          printf 'incy://routing/onadd/%s\n' "$whitelist_b64" > INCY/WHITELIST.DEEPLINK
          printf 'incy://routing/onadd/%s\n' "$jsonsub_b64" > INCY/JSONSUB.DEEPLINK

      - name: Update SINGBOX geodata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-singbox-geodata.py SINGBOX/DEFAULT.JSON

      - name: Detect routing changes
        id: routing_change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          xray_source_changed=false
          if [[ "$EVENT_NAME" == "push" ]] \
            && [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            && [[ ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            if ! git diff --quiet "$EVENT_BEFORE" "$EVENT_SHA" -- \
              XRAY_JSON/DEFAULT.JSON \
              XRAY_JSON/RUSSIAN_IP.JSON \
              XRAY_JSON/LEASTLOAD.settings.json \
              SINGBOX/DEFAULT.JSON \
              response_rules.json \
              scripts/render-xray-json.sh \
              scripts/check-russian-ip.py \
              scripts/render-xray-least-load.sh \
              scripts/render-v2raytun.py \
              scripts/update-singbox-geodata.py \
              scripts/sync-remnawave-routing.sh \
              scripts/tests/test_remnawave_sync.py \
              scripts/tests/test_singbox.py \
              scripts/tests/test_v2raytun.py \
              .github/workflows/update-configs.yml; then
              xray_source_changed=true
            fi
          fi

          if git diff --quiet -- HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.DEEPLINK SINGBOX/DEFAULT.JSON \
            && [[ "$xray_source_changed" == "false" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HAPP/DEFAULT.JSON HAPP/WHITELIST.JSON HAPP/JSONSUB.JSON HAPP/DEFAULT.DEEPLINK HAPP/WHITELIST.DEEPLINK HAPP/JSONSUB.DEEPLINK INCY/DEFAULT.JSON INCY/WHITELIST.JSON INCY/JSONSUB.JSON INCY/DEFAULT.DEEPLINK INCY/WHITELIST.DEEPLINK INCY/JSONSUB.DEEPLINK SINGBOX/DEFAULT.JSON

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "$(date -u +%Y%m%d%H%M)"
          git push

      - name: Export deeplinks
        id: deeplinks
        shell: bash
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "happ_default=$(tr -d '\n\r' < HAPP/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_whitelist=$(tr -d '\n\r' < HAPP/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_json=$(tr -d '\n\r' < HAPP/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_default=$(tr -d '\n\r' < INCY/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_whitelist=$(tr -d '\n\r' < INCY/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_json=$(tr -d '\n\r' < INCY/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to servers
        shell: bash
        run: |
          set -euo pipefail

          HAPP_DEFAULT="${{ needs.update.outputs.happ_default }}"
          HAPP_WHITELIST="${{ needs.update.outputs.happ_whitelist }}"
          HAPP_JSON="${{ needs.update.outputs.happ_json }}"
          INCY_DEFAULT="${{ needs.update.outputs.incy_default }}"
          INCY_WHITELIST="${{ needs.update.outputs.incy_whitelist }}"
          INCY_JSON="${{ needs.update.outputs.incy_json }}"

          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key)

          # Comma-separated user@host or user@host:port entries.
          IFS=',' read -ra SERVERS <<< "${{ secrets.DEPLOY_SERVERS }}"

          TOTAL=${#SERVERS[@]}
          FAIL_COUNT=0

          for i in "${!SERVERS[@]}"; do
            SRV_NUM=$((i + 1))
            SERVER="$(echo "${SERVERS[$i]}" | xargs)"
            SSH_PORT=22

            if [[ "$SERVER" =~ ^(.+):([0-9]+)$ ]]; then
              SSH_PORT="${BASH_REMATCH[2]}"
              SERVER="${BASH_REMATCH[1]}"
            fi

            if (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
              echo "SRV${SRV_NUM} - FAIL (invalid SSH port: $SSH_PORT)"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi

            set +e
            LOG_FILE=$(mktemp)
            ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "$SERVER" bash -s -- \
              "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON" \
              "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON" > "$LOG_FILE" 2>&1 <<'REMOTE_SCRIPT'
              set -euo pipefail

              HAPP_DEFAULT="$1"; HAPP_WHITELIST="$2"; HAPP_JSON="$3"
              INCY_DEFAULT="$4"; INCY_WHITELIST="$5"; INCY_JSON="$6"

              ACTIONS=""

              # --- Geofiles ---
              if [ -d /opt/remnanode ]; then
                TARGET=/opt/remnanode
              elif [ -d /opt/remnawave/node ]; then
                TARGET=/opt/remnawave/node
              else
                TARGET=""
              fi

              if [ -n "$TARGET" ]; then
                NEED_RESTART=false

                # Get remote hashes without sudo (not needed for reading public URLs)
                REMOTE_GEOIP_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/losogudok/freemanvpn-geoip/releases/latest/download/geoip.dat.sha256" | awk '{print $1}' || echo "")
                REMOTE_GEOSITE_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/losogudok/freemanvpn-geosite/releases/latest/download/geosite.dat.sha256" | awk '{print $1}' || echo "")

                if [ -z "$REMOTE_GEOIP_SHA" ] || [ -z "$REMOTE_GEOSITE_SHA" ]; then
                  echo "Error: Could not fetch remote hashes"
                  exit 1
                fi

                if [ -f "$TARGET/geoip.dat" ]; then
                  LOCAL_GEOIP_SHA=$(sudo sha256sum "$TARGET/geoip.dat" | awk '{print $1}')
                else
                  LOCAL_GEOIP_SHA=""
                fi

                if [ -f "$TARGET/geosite.dat" ]; then
                  LOCAL_GEOSITE_SHA=$(sudo sha256sum "$TARGET/geosite.dat" | awk '{print $1}')
                else
                  LOCAL_GEOSITE_SHA=""
                fi

                if [ "$REMOTE_GEOIP_SHA" != "$LOCAL_GEOIP_SHA" ]; then
                  TMP_GEOIP=$(mktemp)
                  curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TMP_GEOIP" "https://github.com/losogudok/freemanvpn-geoip/releases/latest/download/geoip.dat"
                  sudo mv "$TMP_GEOIP" "$TARGET/geoip.dat"
                  sudo chmod 644 "$TARGET/geoip.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geoip.dat "
                fi

                if [ "$REMOTE_GEOSITE_SHA" != "$LOCAL_GEOSITE_SHA" ]; then
                  TMP_GEOSITE=$(mktemp)
                  curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TMP_GEOSITE" "https://github.com/losogudok/freemanvpn-geosite/releases/latest/download/geosite.dat"
                  sudo mv "$TMP_GEOSITE" "$TARGET/geosite.dat"
                  sudo chmod 644 "$TARGET/geosite.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geosite.dat "
                fi

                if [ "$NEED_RESTART" = true ]; then
                  cd "$TARGET"
                  sudo docker compose down && sudo docker compose up -d
                  cd /
                fi
              fi

              # --- Nginx ---
              if [ -f /etc/nginx/sites-available/default ] && [ -f /etc/nginx/sites-available/incy.conf ]; then
                update_config() {
                  local FILE="$1" DEF="$2" WL="$3" JS="$4"
                  local TMP=$(mktemp)
                  awk -v def="$DEF" -v wl="$WL" -v js="$JS" '
                    /location = \/[[:space:]]*$/ { loc="default" }
                    /location = \/whitelist/ { loc="whitelist" }
                    /location = \/json/ { loc="json" }
                    /rewrite \// {
                      if (loc == "default") { sub(/rewrite \/.*redirect;/, "rewrite / " def " redirect;"); loc="" }
                      else if (loc == "whitelist") { sub(/rewrite \/.*redirect;/, "rewrite / " wl " redirect;"); loc="" }
                      else if (loc == "json") { sub(/rewrite \/.*redirect;/, "rewrite / " js " redirect;"); loc="" }
                    }
                    { print }
                  ' "$FILE" > "$TMP"
                  sudo mv "$TMP" "$FILE"
                  sudo chmod 644 "$FILE"
                }

                update_config /etc/nginx/sites-available/default "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON"
                update_config /etc/nginx/sites-available/incy.conf "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON"

                sudo nginx -t && sudo service nginx restart
                ACTIONS="${ACTIONS}nginx "
              fi

              # --- Result ---
              if [ -z "$ACTIONS" ]; then
                echo "up to date"
              else
                echo "updated ${ACTIONS% }"
              fi
          REMOTE_SCRIPT
            ssh_exit=$?
            set -e

            if [ $ssh_exit -ne 0 ]; then
              if [ $ssh_exit -eq 255 ]; then
                echo "SRV${SRV_NUM} - FAIL (connection error)"
              else
                echo "SRV${SRV_NUM} - FAIL (script error, exit $ssh_exit)"
              fi
              sed 's/^/  /' "$LOG_FILE"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            else
              RESULT=$(tail -n 1 "$LOG_FILE")
              if echo "$RESULT" | grep -q "^updated"; then
                FILES=$(echo "$RESULT" | sed 's/^updated //')
                echo "SRV${SRV_NUM} - OK (updated $FILES)"
              else
                echo "SRV${SRV_NUM} - OK (up to date)"
              fi
            fi
            rm -f "$LOG_FILE"
          done

          rm -f ~/.ssh/deploy_key

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "Failed: $FAIL_COUNT/$TOTAL servers"
            exit 1
          fi

  sync-remnawave:
    needs: [update, build-xray, publish-xray]
    if: needs.update.outputs.routing_changed == 'true' || inputs.force_sync == true
    runs-on: ubuntu-latest

    env:
      REMNAWAVE_API_BASE_URL: ${{ vars.REMNAWAVE_API_BASE_URL }}
      REMNAWAVE_TOKEN: ${{ secrets.REMNAWAVE_TOKEN }}
      REMNAWAVE_DEFAULT_TEMPLATE_UUID: ${{ vars.REMNAWAVE_DEFAULT_TEMPLATE_UUID }}
      REMNAWAVE_LEASTLOAD_TEMPLATE_UUID: ${{ vars.REMNAWAVE_LEASTLOAD_TEMPLATE_UUID }}
      REMNAWAVE_V2RAYTUN_TEMPLATE_UUID: ${{ vars.REMNAWAVE_V2RAYTUN_TEMPLATE_UUID }}
      REMNAWAVE_V2RAYTUN_AUTO_TEMPLATE_UUID: ${{ vars.REMNAWAVE_V2RAYTUN_AUTO_TEMPLATE_UUID }}
      REMNAWAVE_SINGBOX_TEMPLATE_UUID: ${{ vars.REMNAWAVE_SINGBOX_TEMPLATE_UUID }}
      REMNAWAVE_RU_IP_TEMPLATE_UUID: ${{ vars.REMNAWAVE_RU_IP_TEMPLATE_UUID }}
      HAPP_DEFAULT: ${{ needs.update.outputs.happ_default }}
      INCY_DEFAULT: ${{ needs.update.outputs.incy_default }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.source_commit }}

      - name: Install sing-box for validation
        shell: bash
        run: |
          set -euo pipefail
          version=1.13.12
          arch="$(dpkg --print-architecture)"
          archive="/tmp/sing-box-${version}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            -o "$archive" \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-${arch}.tar.gz"
          tar -xzf "$archive" -C /tmp
          sudo install "/tmp/sing-box-${version}-linux-${arch}/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Test Remnawave synchronization
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - uses: actions/download-artifact@v4
        with:
          name: xray-json
          path: dist/xray-json

      - name: Diagnose panel connectivity without authentication
        shell: bash
        run: |
          set -euo pipefail
          panel_host="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["REMNAWAVE_API_BASE_URL"]).hostname or "")')"
          echo "[NET-DIAG] System DNS for $panel_host:"
          getent ahostsv4 "$panel_host" || true
          echo "[NET-DIAG] Public DNS for $panel_host:"
          curl -fsS --connect-timeout 5 --max-time 10 --get \
            --data-urlencode "name=$panel_host" --data-urlencode 'type=A' \
            https://dns.google/resolve | jq '{Status, Answer}' || true
          for mode in default ipv4-http1 tls12; do
            probe_options=()
            if [[ "$mode" == ipv4-http1 ]]; then probe_options=(-4 --http1.1); fi
            if [[ "$mode" == tls12 ]]; then probe_options=(-4 --http1.1 --tlsv1.2 --tls-max 1.2); fi
            echo "[NET-DIAG] Panel probe: $mode (HTTP 401 is expected without a token)"
            if curl "${probe_options[@]}" -sS \
              --connect-timeout 10 --max-time 15 -o /dev/null \
              -w 'HTTP=%{http_code} peer=%{remote_ip} connect=%{time_connect}s TLS=%{time_appconnect}s verify=%{ssl_verify_result}\n' \
              "${REMNAWAVE_API_BASE_URL%/}/subscription-templates"; then
              echo "[NET-DIAG] Probe completed"
            else
              echo "[NET-DIAG] Probe failed with curl exit code $?"
            fi
          done

      - name: Synchronize routing templates and client headers
        shell: bash
        run: bash scripts/sync-remnawave-routing.sh dist/xray-json
