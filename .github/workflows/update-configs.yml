name: Update Routing Configs

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Run sync-remnawave even without routing changes'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  repository_dispatch:
    types: [update-routing-configs]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      happ_default: ${{ steps.deeplinks.outputs.happ_default }}
      happ_whitelist: ${{ steps.deeplinks.outputs.happ_whitelist }}
      happ_json: ${{ steps.deeplinks.outputs.happ_json }}
      incy_default: ${{ steps.deeplinks.outputs.incy_default }}
      incy_whitelist: ${{ steps.deeplinks.outputs.incy_whitelist }}
      incy_json: ${{ steps.deeplinks.outputs.incy_json }}
      routing_changed: ${{ steps.routing_change.outputs.changed }}

    steps:
      - uses: actions/checkout@v6

      - name: Update HAPP configs
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="losogudok/freemanvpn-geoip"
          GEOSITE_REPO="losogudok/freemanvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          epoch_to_tag_utc() {
            local e="${1:-0}"
            if [[ "$e" =~ ^[0-9]+$ ]] && (( e > 0 )); then
              date -u -d "@$e" +%Y%m%d%H%M
            else
              printf '000000000000'
            fi
          }

          current_epoch="$(jq -r '.LastUpdated // empty' HAPP/DEFAULT.JSON 2>/dev/null || true)"
          [[ "$current_epoch" =~ ^[0-9]+$ ]] || current_epoch="0"
          current_tag="$(epoch_to_tag_utc "$current_epoch")"

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          max_tag="$(printf "%s\n%s\n" "$geoip_tag" "$geosite_tag" | sort -r | head -n 1)"

          if [[ "$current_tag" < "$max_tag" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}@${geoip_tag}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}@${geosite_tag}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/DEFAULT.JSON > "$tmp"
            mv "$tmp" HAPP/DEFAULT.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/WHITELIST.JSON > "$tmp"
            mv "$tmp" HAPP/WHITELIST.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              HAPP/JSONSUB.JSON > "$tmp"
            mv "$tmp" HAPP/JSONSUB.JSON
          fi

          default_b64="$(jq -c . HAPP/DEFAULT.JSON | base64 -w 0)"
          whitelist_b64="$(jq -c . HAPP/WHITELIST.JSON | base64 -w 0)"
          jsonsub_b64="$(jq -c . HAPP/JSONSUB.JSON | base64 -w 0)"

          printf 'happ://routing/onadd/%s\n' "$default_b64" > HAPP/DEFAULT.DEEPLINK
          printf 'happ://routing/onadd/%s\n' "$whitelist_b64" > HAPP/WHITELIST.DEEPLINK
          printf 'happ://routing/onadd/%s\n' "$jsonsub_b64" > HAPP/JSONSUB.DEEPLINK
          
      - name: Update INCY configs
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="losogudok/freemanvpn-geoip"
          GEOSITE_REPO="losogudok/freemanvpn-geosite"

          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          epoch_to_tag_utc() {
            local e="${1:-0}"
            if [[ "$e" =~ ^[0-9]+$ ]] && (( e > 0 )); then
              date -u -d "@$e" +%Y%m%d%H%M
            else
              printf '000000000000'
            fi
          }

          current_epoch="$(jq -r '.LastUpdated // empty' INCY/DEFAULT.JSON 2>/dev/null || true)"
          [[ "$current_epoch" =~ ^[0-9]+$ ]] || current_epoch="0"
          current_tag="$(epoch_to_tag_utc "$current_epoch")"

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          max_tag="$(printf "%s\n%s\n" "$geoip_tag" "$geosite_tag" | sort -r | head -n 1)"

          if [[ "$current_tag" < "$max_tag" ]]; then
            now_epoch="$(date -u +%s)"
            geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}/release/geoip.dat"
            geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}/release/geosite.dat"

            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/DEFAULT.JSON > "$tmp"
            mv "$tmp" INCY/DEFAULT.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/WHITELIST.JSON > "$tmp"
            mv "$tmp" INCY/WHITELIST.JSON
            tmp="$(mktemp)"
            jq \
              --arg ts "$now_epoch" \
              --arg geoip "$geoip_url" \
              --arg geosite "$geosite_url" \
              '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' \
              INCY/JSONSUB.JSON > "$tmp"
            mv "$tmp" INCY/JSONSUB.JSON
          fi

          default_b64="$(jq -c . INCY/DEFAULT.JSON | base64 -w 0)"
          whitelist_b64="$(jq -c . INCY/WHITELIST.JSON | base64 -w 0)"
          jsonsub_b64="$(jq -c . INCY/JSONSUB.JSON | base64 -w 0)"

          printf 'incy://routing/onadd/%s\n' "$default_b64" > INCY/DEFAULT.DEEPLINK
          printf 'incy://routing/onadd/%s\n' "$whitelist_b64" > INCY/WHITELIST.DEEPLINK
          printf 'incy://routing/onadd/%s\n' "$jsonsub_b64" > INCY/JSONSUB.DEEPLINK

      - name: Detect default routing changes
        id: routing_change
        shell: bash
        run: |
          if git diff --quiet -- HAPP/DEFAULT.DEEPLINK INCY/DEFAULT.DEEPLINK; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HAPP/DEFAULT.JSON HAPP/WHITELIST.JSON HAPP/JSONSUB.JSON HAPP/DEFAULT.DEEPLINK HAPP/WHITELIST.DEEPLINK HAPP/JSONSUB.DEEPLINK INCY/DEFAULT.JSON INCY/WHITELIST.JSON INCY/JSONSUB.JSON INCY/DEFAULT.DEEPLINK INCY/WHITELIST.DEEPLINK INCY/JSONSUB.DEEPLINK

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "$(date -u +%Y%m%d%H%M)"
          git push

      - name: Export deeplinks
        id: deeplinks
        shell: bash
        run: |
          echo "happ_default=$(tr -d '\n\r' < HAPP/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_whitelist=$(tr -d '\n\r' < HAPP/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "happ_json=$(tr -d '\n\r' < HAPP/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_default=$(tr -d '\n\r' < INCY/DEFAULT.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_whitelist=$(tr -d '\n\r' < INCY/WHITELIST.DEEPLINK)" >> "$GITHUB_OUTPUT"
          echo "incy_json=$(tr -d '\n\r' < INCY/JSONSUB.DEEPLINK)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to servers
        shell: bash
        run: |
          set -euo pipefail

          HAPP_DEFAULT="${{ needs.update.outputs.happ_default }}"
          HAPP_WHITELIST="${{ needs.update.outputs.happ_whitelist }}"
          HAPP_JSON="${{ needs.update.outputs.happ_json }}"
          INCY_DEFAULT="${{ needs.update.outputs.incy_default }}"
          INCY_WHITELIST="${{ needs.update.outputs.incy_whitelist }}"
          INCY_JSON="${{ needs.update.outputs.incy_json }}"

          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key)

          # Comma-separated user@host or user@host:port entries.
          IFS=',' read -ra SERVERS <<< "${{ secrets.DEPLOY_SERVERS }}"

          TOTAL=${#SERVERS[@]}
          FAIL_COUNT=0

          for i in "${!SERVERS[@]}"; do
            SRV_NUM=$((i + 1))
            SERVER="$(echo "${SERVERS[$i]}" | xargs)"
            SSH_PORT=22

            if [[ "$SERVER" =~ ^(.+):([0-9]+)$ ]]; then
              SSH_PORT="${BASH_REMATCH[2]}"
              SERVER="${BASH_REMATCH[1]}"
            fi

            if (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
              echo "SRV${SRV_NUM} - FAIL (invalid SSH port: $SSH_PORT)"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi

            set +e
            LOG_FILE=$(mktemp)
            ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "$SERVER" bash -s -- \
              "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON" \
              "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON" > "$LOG_FILE" 2>&1 <<'REMOTE_SCRIPT'
              set -euo pipefail

              HAPP_DEFAULT="$1"; HAPP_WHITELIST="$2"; HAPP_JSON="$3"
              INCY_DEFAULT="$4"; INCY_WHITELIST="$5"; INCY_JSON="$6"

              ACTIONS=""

              # --- Geofiles ---
              if [ -d /opt/remnanode ]; then
                TARGET=/opt/remnanode
              elif [ -d /opt/remnawave/node ]; then
                TARGET=/opt/remnawave/node
              else
                TARGET=""
              fi

              if [ -n "$TARGET" ]; then
                NEED_RESTART=false

                # Get remote hashes without sudo (not needed for reading public URLs)
                REMOTE_GEOIP_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/losogudok/freemanvpn-geoip/releases/latest/download/geoip.dat.sha256" | awk '{print $1}' || echo "")
                REMOTE_GEOSITE_SHA=$(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://github.com/losogudok/freemanvpn-geosite/releases/latest/download/geosite.dat.sha256" | awk '{print $1}' || echo "")

                if [ -z "$REMOTE_GEOIP_SHA" ] || [ -z "$REMOTE_GEOSITE_SHA" ]; then
                  echo "Error: Could not fetch remote hashes"
                  exit 1
                fi

                if [ -f "$TARGET/geoip.dat" ]; then
                  LOCAL_GEOIP_SHA=$(sudo sha256sum "$TARGET/geoip.dat" | awk '{print $1}')
                else
                  LOCAL_GEOIP_SHA=""
                fi

                if [ -f "$TARGET/geosite.dat" ]; then
                  LOCAL_GEOSITE_SHA=$(sudo sha256sum "$TARGET/geosite.dat" | awk '{print $1}')
                else
                  LOCAL_GEOSITE_SHA=""
                fi

                if [ "$REMOTE_GEOIP_SHA" != "$LOCAL_GEOIP_SHA" ]; then
                  TMP_GEOIP=$(mktemp)
                  curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TMP_GEOIP" "https://github.com/losogudok/freemanvpn-geoip/releases/latest/download/geoip.dat"
                  sudo mv "$TMP_GEOIP" "$TARGET/geoip.dat"
                  sudo chmod 644 "$TARGET/geoip.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geoip.dat "
                fi

                if [ "$REMOTE_GEOSITE_SHA" != "$LOCAL_GEOSITE_SHA" ]; then
                  TMP_GEOSITE=$(mktemp)
                  curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$TMP_GEOSITE" "https://github.com/losogudok/freemanvpn-geosite/releases/latest/download/geosite.dat"
                  sudo mv "$TMP_GEOSITE" "$TARGET/geosite.dat"
                  sudo chmod 644 "$TARGET/geosite.dat"
                  NEED_RESTART=true
                  ACTIONS="${ACTIONS}geosite.dat "
                fi

                if [ "$NEED_RESTART" = true ]; then
                  cd "$TARGET"
                  sudo docker compose down && sudo docker compose up -d
                  cd /
                fi
              fi

              # --- Nginx ---
              if [ -f /etc/nginx/sites-available/default ] && [ -f /etc/nginx/sites-available/incy.conf ]; then
                update_config() {
                  local FILE="$1" DEF="$2" WL="$3" JS="$4"
                  local TMP=$(mktemp)
                  awk -v def="$DEF" -v wl="$WL" -v js="$JS" '
                    /location = \/[[:space:]]*$/ { loc="default" }
                    /location = \/whitelist/ { loc="whitelist" }
                    /location = \/json/ { loc="json" }
                    /rewrite \// {
                      if (loc == "default") { sub(/rewrite \/.*redirect;/, "rewrite / " def " redirect;"); loc="" }
                      else if (loc == "whitelist") { sub(/rewrite \/.*redirect;/, "rewrite / " wl " redirect;"); loc="" }
                      else if (loc == "json") { sub(/rewrite \/.*redirect;/, "rewrite / " js " redirect;"); loc="" }
                    }
                    { print }
                  ' "$FILE" > "$TMP"
                  sudo mv "$TMP" "$FILE"
                  sudo chmod 644 "$FILE"
                }

                update_config /etc/nginx/sites-available/default "$HAPP_DEFAULT" "$HAPP_WHITELIST" "$HAPP_JSON"
                update_config /etc/nginx/sites-available/incy.conf "$INCY_DEFAULT" "$INCY_WHITELIST" "$INCY_JSON"

                sudo nginx -t && sudo service nginx restart
                ACTIONS="${ACTIONS}nginx "
              fi

              # --- Result ---
              if [ -z "$ACTIONS" ]; then
                echo "up to date"
              else
                echo "updated ${ACTIONS% }"
              fi
          REMOTE_SCRIPT
            ssh_exit=$?
            set -e

            if [ $ssh_exit -ne 0 ]; then
              if [ $ssh_exit -eq 255 ]; then
                echo "SRV${SRV_NUM} - FAIL (connection error)"
              else
                echo "SRV${SRV_NUM} - FAIL (script error, exit $ssh_exit)"
              fi
              sed 's/^/  /' "$LOG_FILE"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            else
              RESULT=$(tail -n 1 "$LOG_FILE")
              if echo "$RESULT" | grep -q "^updated"; then
                FILES=$(echo "$RESULT" | sed 's/^updated //')
                echo "SRV${SRV_NUM} - OK (updated $FILES)"
              else
                echo "SRV${SRV_NUM} - OK (up to date)"
              fi
            fi
            rm -f "$LOG_FILE"
          done

          rm -f ~/.ssh/deploy_key

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "Failed: $FAIL_COUNT/$TOTAL servers"
            exit 1
          fi

  sync-remnawave:
    needs: update
    if: needs.update.outputs.routing_changed == 'true' || inputs.force_sync == true
    runs-on: ubuntu-latest

    env:
      REMNAWAVE_API_BASE_URL: ${{ vars.REMNAWAVE_API_BASE_URL }}
      REMNAWAVE_TOKEN: ${{ secrets.REMNAWAVE_TOKEN }}
      HAPP_DEFAULT: ${{ needs.update.outputs.happ_default }}
      INCY_DEFAULT: ${{ needs.update.outputs.incy_default }}

    steps:
      - name: Update HAPP and INCY response rules
        shell: bash
        run: |
          set -euo pipefail

          : "${REMNAWAVE_API_BASE_URL:?Set the REMNAWAVE_API_BASE_URL repository variable}"
          : "${REMNAWAVE_TOKEN:?Set the REMNAWAVE_TOKEN repository secret}"

          SETTINGS_URL="${REMNAWAVE_API_BASE_URL%/}/subscription-settings"
          AUTH_HEADER="Authorization: Bearer ${REMNAWAVE_TOKEN}"

          CURRENT_SETTINGS="$(
            curl -fsS \
              -H "Accept: application/json" \
              -H "$AUTH_HEADER" \
              "$SETTINGS_URL"
          )"

          PATCH_PAYLOAD="$(
            jq -ce \
              --arg happ "$HAPP_DEFAULT" \
              --arg incy "$INCY_DEFAULT" \
              '
                (.response // .) as $settings
                | ($settings.responseRules.rules // []) as $rules
                | if $settings.responseRules == null then
                    error("responseRules is null in subscription settings; create Response Rules in the panel first")
                  elif ([$rules[] | select(.name == "HAPP")] | length) != 1 then
                    error("expected exactly one HAPP response rule; found rule names: " + ([$rules[].name] | join(", ") | if . == "" then "<none>" else . end))
                  elif ([$rules[] | select(.name == "INCY")] | length) != 1 then
                    error("expected exactly one INCY response rule; found rule names: " + ([$rules[].name] | join(", ") | if . == "" then "<none>" else . end))
                  elif ([
                    $rules[]
                    | select(.name == "HAPP")
                    | .responseModifications.headers[]?
                    | select(((.key // "") | ascii_downcase) == "routing")
                  ] | length) != 1 then
                    error("expected exactly one routing header in HAPP response rule; found headers: " + ([$rules[] | select(.name == "HAPP") | .responseModifications.headers[]? | .key] | join(", ") | if . == "" then "<none>" else . end))
                  elif ([
                    $rules[]
                    | select(.name == "INCY")
                    | .responseModifications.headers[]?
                    | select(((.key // "") | ascii_downcase) == "routing")
                  ] | length) != 1 then
                    error("expected exactly one routing header in INCY response rule; found headers: " + ([$rules[] | select(.name == "INCY") | .responseModifications.headers[]? | .key] | join(", ") | if . == "" then "<none>" else . end))
                  else
                    {
                      uuid: $settings.uuid,
                      customResponseHeaders: (
                        $settings.customResponseHeaders
                        | if . == null then null
                          else with_entries(select((.key | ascii_downcase) != "routing"))
                          end
                      ),
                      responseRules: (
                        $settings.responseRules
                        | .rules |= map(
                            if .name == "HAPP" then
                              .responseModifications.headers |= map(
                                if ((.key // "") | ascii_downcase) == "routing"
                                then .value = $happ
                                else .
                                end
                              )
                            elif .name == "INCY" then
                              .responseModifications.headers |= map(
                                if ((.key // "") | ascii_downcase) == "routing"
                                then .value = $incy
                                else .
                                end
                              )
                            else
                              .
                            end
                          )
                      )
                    }
                  end
              ' <<< "$CURRENT_SETTINGS"
          )"

          PATCH_RESPONSE="$(
            curl -fsS \
              -X PATCH \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "$AUTH_HEADER" \
              --data "$PATCH_PAYLOAD" \
              "$SETTINGS_URL"
          )"

          jq -e \
            --arg happ "$HAPP_DEFAULT" \
            --arg incy "$INCY_DEFAULT" \
            '
              (.response // .).responseRules.rules as $rules
              | ([
                  $rules[]
                  | select(.name == "HAPP")
                  | .responseModifications.headers[]?
                  | select(((.key // "") | ascii_downcase) == "routing")
                  | .value
                ] == [$happ])
                and
                ([
                    $rules[]
                    | select(.name == "INCY")
                    | .responseModifications.headers[]?
                    | select(((.key // "") | ascii_downcase) == "routing")
                    | .value
                  ] == [$incy])
                and
                ((.response // .).customResponseHeaders // {}
                  | keys
                  | map(ascii_downcase)
                  | index("routing")
                  | not)
            ' <<< "$PATCH_RESPONSE" > /dev/null

          echo "Remnawave HAPP and INCY routing updated"
